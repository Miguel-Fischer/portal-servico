<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | La Bambinela</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>La Bambinela</h1>
    <p>Panificadora artesanal — pão quentinho e atendimento sem enrolação.</p>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="servicos.html">Serviços</a>
    <a href="contato.html">Contato</a>
  </nav>

  <main>
    <section>
      <h2>Entre em contato</h2>
      <p>Preencha os campos abaixo e enviaremos sua solicitação assim que possível.</p>

      <form id="formContato">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto" required>
          <option value="">Selecione</option>
          <option value="cardapio">Consulta ao cardápio</option>
          <option value="encomenda">Encomenda de produtos</option>
          <option value="coffee-break">Coffee break / orçamento</option>
          <option value="acompanhamento">Acompanhamento de pedido</option>
          <option value="horarios">Horários e localização</option>
        </select>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit">Enviar</button>

        <p id="mensagemForm" aria-live="polite"></p>
      </form>
    </section>

    <section class="preferencia">
      <h2>Meu serviço favorito</h2>
      <label for="servicoFavorito">Escolha:</label>
      <select id="servicoFavorito">
        <option value="">Selecione...</option>
        <option value="cardapio">Cardápio</option>
        <option value="encomenda">Encomenda</option>
        <option value="coffee-break">Coffee break</option>
        <option value="acompanhamento">Acompanhamento de pedidos</option>
        <option value="horarios">Horários e localização</option>
      </select>

      <button id="btnSalvarFavorito" type="button">Salvar favorito</button>
      <p id="favoritoSalvo" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>La Bambinela — Panificadora | Projeto acadêmico, Programação Web</p>
  </footer>

  <script src="js/contato.js"></script>
</body>
</html>
